name: CI

# Run on every push (any branch) and on every pull request that targets main.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Least privilege: the GITHUB_TOKEN can only read the repository contents.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run linter
        run: npm run lint

      - name: Build check (start the app and call /health)
        run: npm run build
