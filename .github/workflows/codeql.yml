name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # needed to upload results to the Security tab
  actions: read

jobs:
  analyze:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
          output: sarif-results

      - name: SAST gate (fail on HIGH or CRITICAL findings, security-severity >= 7.0)
        run: |
          findings=$(jq -r '
            .runs[] as $run
            | ([$run.tool.driver.rules[]?, $run.tool.extensions[]?.rules[]?]
               | map({key: .id, value: ((.properties["security-severity"] // "0") | tonumber)})
               | from_entries) as $sev
            | $run.results[]
            | select(($sev[.ruleId] // 0) >= 7.0)
            | "\(.ruleId) [security-severity \($sev[.ruleId])] \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) - \(.message.text)"
          ' sarif-results/*.sarif)
          if [ -n "$findings" ]; then
            echo "CodeQL found HIGH/CRITICAL issues:"
            echo "$findings" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          echo "No HIGH or CRITICAL CodeQL findings."
